<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinoku — Reviews for Websites & Digital Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    .tp-star {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: #ffffff;
      font-size: 0.75rem;
      line-height: 1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500/20 selection:text-emerald-400">

  <header class="sticky top-0 z-20 border-b border-slate-800/80 bg-[#090d16]/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <button onclick="resetFilters()" class="flex items-center gap-2.5 text-left focus:outline-none">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-extrabold text-lg shadow-sm">
          ★
        </div>
        <span class="font-extrabold text-xl tracking-tight">Kinoku</span>
      </button>
      <button onclick="openWriteModal()" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs sm:text-sm transition-colors">
        + Write a Review
      </button>
    </div>
  </header>

  <section class="max-w-3xl mx-auto w-full px-4 sm:px-6 pt-10 pb-6 text-center">
    <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight mb-2">
      Community Reviews for the Web & Beyond
    </h1>
    <p class="text-slate-400 text-sm sm:text-base mb-6">
      Honest ratings for websites, apps, anime platforms, and games.
    </p>
    <div class="relative">
      <input
        type="text"
        id="searchInput"
        oninput="render()"
        placeholder="Search by name, domain, or review keyword..."
        class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-800 text-sm sm:text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
      />
    </div>
  </section>

  <section class="max-w-6xl mx-auto w-full px-4 sm:px-6 pb-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-800/80">
      <div id="categoryBar" class="flex items-center gap-1.5 flex-wrap"></div>
      <div class="flex items-center gap-2 shrink-0">
        <label for="sortSelect" class="text-xs text-slate-400 font-medium">Sort:</label>
        <select
          id="sortSelect"
          onchange="render()"
          class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-medium text-slate-200 focus:outline-none focus:border-emerald-500"
        >
          <option value="highest">Highest Rated</option>
          <option value="most">Most Reviewed</option>
          <option value="lowest">Lowest Rated</option>
        </select>
      </div>
    </div>
  </section>

  <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 pb-16 flex-1">
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="emptyState" class="hidden text-center py-14 bg-slate-900/50 border border-slate-800 rounded-2xl">
      <p class="text-slate-400 text-sm mb-3">No matching items found.</p>
      <button onclick="resetFilters()" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold">
        Reset Filters
      </button>
    </div>
  </main>

  <div id="detailModal" class="fixed inset-0 z-40 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4" onclick="closeDetailModal(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div id="detailHeader" class="p-5 border-b border-slate-800 flex items-start justify-between gap-4"></div>
      <div id="detailReviews" class="p-5 overflow-y-auto space-y-3 flex-1"></div>
      <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex justify-between items-center">
        <button onclick="closeDetailModal()" class="px-4 py-2 rounded-lg border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-800">
          Close
        </button>
        <button id="detailAddReviewBtn" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs">
          + Review This Item
        </button>
      </div>
    </div>
  </div>

  <div id="writeModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4" onclick="closeWriteModal(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
      <div class="p-5 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-bold text-base">Submit a Review</h2>
        <button onclick="closeWriteModal()" class="text-slate-400 hover:text-slate-200 text-sm px-2 py-1">✕</button>
      </div>
      <form id="reviewForm" onsubmit="submitReview(event)" class="p-5 space-y-4">
        <div class="flex gap-2 p-1 rounded-lg bg-slate-950 border border-slate-800 text-xs font-semibold">
          <button type="button" id="modeExistingBtn" onclick="setFormMode('existing')" class="flex-1 py-1.5 rounded-md bg-emerald-500 text-slate-950">
            Existing Item
          </button>
          <button type="button" id="modeNewBtn" onclick="setFormMode('new')" class="flex-1 py-1.5 rounded-md text-slate-400">
            + New Item
          </button>
        </div>

        <div id="existingGroup">
          <label class="block text-xs text-slate-400 mb-1">Choose Item</label>
          <select id="existingSelect" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500"></select>
        </div>

        <div id="newGroup" class="hidden space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Obsidian" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Domain / Subtitle</label>
              <input type="text" id="itemDomain" placeholder="e.g. obsidian.md" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Category</label>
              <select id="itemCategory" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500">
                <option value="Websites">Websites</option>
                <option value="Apps & Tools">Apps & Tools</option>
                <option value="Anime & Media">Anime & Media</option>
                <option value="Gaming">Gaming</option>
              </select>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Your Name</label>
            <input type="text" id="reviewAuthor" required placeholder="e.g. Alex" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Rating (1 - 5)</label>
            <select id="reviewScore" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500">
              <option value="5">5 ★ — Excellent</option>
              <option value="4">4 ★ — Good</option>
              <option value="3">3 ★ — Average</option>
              <option value="2">2 ★ — Poor</option>
              <option value="1">1 ★ — Bad</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Your Review</label>
          <textarea id="reviewText" rows="3" required placeholder="Share your experience..." class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeWriteModal()" class="px-4 py-2 rounded-lg border border-slate-700 text-xs font-medium text-slate-300 hover:bg-slate-800">
            Cancel
          </button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs">
            Post Review
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const CATEGORIES = ["All", "Websites", "Apps & Tools", "Anime & Media", "Gaming"];
    const STORAGE_KEY = "kinoku_simple_v1";

    const DEFAULT_ITEMS = [
      {
        id: "github",
        name: "GitHub",
        domain: "github.com",
        category: "Apps & Tools",
        reviews: [
          { author: "Kaito", score: 5, text: "Reliable code hosting and free static deployment with GitHub Pages." },
          { author: "Elena", score: 5, text: "Pull requests, Actions, and dark mode make collaboration effortless." }
        ]
      },
      {
        id: "anilist",
        name: "AniList",
        domain: "anilist.co",
        category: "Anime & Media",
        reviews: [
          { author: "Sora", score: 5, text: "Cleanest anime and manga tracker with zero intrusive ads and a fast API." },
          { author: "Nori", score: 4, text: "Great seasonal charts and flexible scoring systems." }
        ]
      },
      {
        id: "brave",
        name: "Brave Browser",
        domain: "brave.com",
        category: "Apps & Tools",
        reviews: [
          { author: "ZeroTrack", score: 5, text: "Built-in ad and pop-up blocking works right out of the box." },
          { author: "Marcus", score: 4, text: "Fast daily browser once you hide the extra wallet icons." }
        ]
      },
      {
        id: "vscode",
        name: "Visual Studio Code",
        domain: "code.visualstudio.com",
        category: "Apps & Tools",
        reviews: [
          { author: "DevLinx", score: 5, text: "Unmatched extension ecosystem and super responsive editing." }
        ]
      },
      {
        id: "mangadex",
        name: "MangaDex",
        domain: "mangadex.org",
        category: "Anime & Media",
        reviews: [
          { author: "Renji", score: 5, text: "100% ad-free reader with customizable page preloading and layouts." },
          { author: "Chloe", score: 4, text: "Powerful tag filtering and clean dark interface." }
        ]
      },
      {
        id: "discord",
        name: "Discord",
        domain: "discord.com",
        category: "Apps & Tools",
        reviews: [
          { author: "Valkyrie", score: 4, text: "Crystal-clear voice chat and low-latency screen sharing for communities." }
        ]
      },
      {
        id: "little-big-snake",
        name: "Little Big Snake",
        domain: "littlebigsnake.com",
        category: "Gaming",
        reviews: [
          { author: "ArcadeKing", score: 4, text: "Smooth 60fps browser multiplayer game with fun co-op mechanics." }
        ]
      },
      {
        id: "streamads-example",
        name: "StreamAds Example",
        domain: "stream-ads-example.net",
        category: "Websites",
        reviews: [
          { author: "SecWatch", score: 1, text: "Too many aggressive pop-up overlays and misleading download buttons." },
          { author: "Jordan", score: 2, text: "Broken mirror links and constant redirect traps without an adblocker." }
        ]
      }
    ];

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || DEFAULT_ITEMS;
    let activeCategory = "All";
    let formMode = "existing";

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getMetrics(item) {
      const count = item.reviews.length;
      const avg = count ? item.reviews.reduce((sum, r) => sum + Number(r.score), 0) / count : 0;
      return { count, avg: Number(avg.toFixed(1)) };
    }

    function getTierColor(score) {
      if (score >= 4.0) return { bg: "bg-emerald-500", text: "text-emerald-400", badge: "bg-emerald-500 text-slate-950" };
      if (score >= 2.5) return { bg: "bg-amber-500", text: "text-amber-400", badge: "bg-amber-500 text-slate-950" };
      return { bg: "bg-red-500", text: "text-red-400", badge: "bg-red-500 text-white" };
    }

    function renderStars(score) {
      const full = Math.round(score);
      const tier = getTierColor(score);
      let html = '<div class="inline-flex items-center gap-1">';
      for (let i = 1; i <= 5; i++) {
        const cls = i <= full ? tier.bg : "bg-slate-800 text-slate-600";
        html += `<span class="tp-star w-5 h-5 ${cls}">★</span>`;
      }
      html += "</div>";
      return html;
    }

    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = CATEGORIES.map(cat => {
        const active = cat === activeCategory;
        const cls = active
          ? "bg-emerald-500 text-slate-950 font-semibold border-emerald-500"
          : "bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700";
        return `<button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-full border text-xs transition-colors ${cls}">${cat}</button>`;
      }).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      render();
    }

    function resetFilters() {
      activeCategory = "All";
      document.getElementById("searchInput").value = "";
      document.getElementById("sortSelect").value = "highest";
      render();
    }

    function render() {
      renderCategories();
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const sortBy = document.getElementById("sortSelect").value;
      const grid = document.getElementById("cardsGrid");
      const empty = document.getElementById("emptyState");

      const filtered = items.filter(item => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        const matchesQuery = !query ||
          item.name.toLowerCase().includes(query) ||
          item.domain.toLowerCase().includes(query) ||
          item.reviews.some(r => r.text.toLowerCase().includes(query));
        return matchesCat && matchesQuery;
      });

      filtered.sort((a, b) => {
        const mA = getMetrics(a);
        const mB = getMetrics(b);
        if (sortBy === "highest") return mB.avg - mA.avg || mB.count - mA.count;
        if (sortBy === "lowest") return mA.avg - mB.avg || mB.count - mA.count;
        return mB.count - mA.count || mB.avg - mA.avg;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");
      grid.innerHTML = filtered.map(item => {
        const { count, avg } = getMetrics(item);
        const tier = getTierColor(avg);
        const latest = item.reviews[0];
        return `
          <div onclick="openDetail('${escapeHtml(item.id)}')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-xl p-5 flex flex-col justify-between cursor-pointer transition-all hover:-translate-y-0.5">
            <div>
              <div class="flex items-start justify-between gap-2 mb-3">
                <div>
                  <h3 class="font-bold text-base text-slate-100">${escapeHtml(item.name)}</h3>
                  <p class="text-xs text-slate-400">${escapeHtml(item.domain)}</p>
                </div>
                <span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[11px] font-medium shrink-0">
                  ${escapeHtml(item.category)}
                </span>
              </div>
              <div class="flex items-center gap-2.5 my-3">
                <span class="px-2 py-0.5 rounded font-bold text-xs ${tier.badge}">${avg.toFixed(1)}</span>
                ${renderStars(avg)}
                <span class="text-xs text-slate-400">(${count} ${count === 1 ? "review" : "reviews"})</span>
              </div>
            </div>
            <div class="mt-2 pt-3 border-t border-slate-800/80 text-xs text-slate-300 italic line-clamp-2">
              "${escapeHtml(latest ? latest.text : "No reviews yet.")}"
            </div>
          </div>
        `;
      }).join("");
    }

    function openDetail(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const { count, avg } = getMetrics(item);
      const tier = getTierColor(avg);

      document.getElementById("detailHeader").innerHTML = `
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-xl font-bold">${escapeHtml(item.name)}</h2>
            <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-xs">${escapeHtml(item.category)}</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">${escapeHtml(item.domain)}</p>
          <div class="flex items-center gap-2 mt-3">
            <span class="px-2 py-0.5 rounded font-bold text-xs ${tier.badge}">${avg.toFixed(1)}</span>
            ${renderStars(avg)}
            <span class="text-xs text-slate-400">${count} total reviews</span>
          </div>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-200 text-sm px-2 py-1">✕</button>
      `;

      document.getElementById("detailReviews").innerHTML = item.reviews.map(r => `
        <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800/90 space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-xs text-slate-200">${escapeHtml(r.author)}</span>
            ${renderStars(r.score)}
          </div>
          <p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(r.text)}</p>
        </div>
      `).join("");

      document.getElementById("detailAddReviewBtn").onclick = () => {
        closeDetailModal();
        openWriteModal(item.id);
      };

      const modal = document.getElementById("detailModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeDetailModal(e) {
      if (e && e.target.id !== "detailModal") return;
      const modal = document.getElementById("detailModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function setFormMode(mode) {
      formMode = mode;
      const exBtn = document.getElementById("modeExistingBtn");
      const newBtn = document.getElementById("modeNewBtn");
      const exGroup = document.getElementById("existingGroup");
      const newGroup = document.getElementById("newGroup");
      const nameInput = document.getElementById("itemName");
      const domainInput = document.getElementById("itemDomain");

      if (mode === "new") {
        newBtn.className = "flex-1 py-1.5 rounded-md bg-emerald-500 text-slate-950";
        exBtn.className = "flex-1 py-1.5 rounded-md text-slate-400";
        exGroup.classList.add("hidden");
        newGroup.classList.remove("hidden");
        nameInput.required = true;
        domainInput.required = true;
      } else {
        exBtn.className = "flex-1 py-1.5 rounded-md bg-emerald-500 text-slate-950";
        newBtn.className = "flex-1 py-1.5 rounded-md text-slate-400";
        exGroup.classList.remove("hidden");
        newGroup.classList.add("hidden");
        nameInput.required = false;
        domainInput.required = false;
      }
    }

    function openWriteModal(selectedId) {
      const select = document.getElementById("existingSelect");
      select.innerHTML = items.map(i => `<option value="${escapeHtml(i.id)}" ${i.id === selectedId ? "selected" : ""}>${escapeHtml(i.name)} (${escapeHtml(i.domain)})</option>`).join("");
      setFormMode("existing");
      const modal = document.getElementById("writeModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeWriteModal(e) {
      if (e && e.target.id !== "writeModal") return;
      const modal = document.getElementById("writeModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function submitReview(e) {
      e.preventDefault();
      const author = document.getElementById("reviewAuthor").value.trim();
      const score = Number(document.getElementById("reviewScore").value);
      const text = document.getElementById("reviewText").value.trim();

      if (formMode === "new") {
        const name = document.getElementById("itemName").value.trim();
        const domain = document.getElementById("itemDomain").value.trim();
        const category = document.getElementById("itemCategory").value;
        items.unshift({
          id: "item-" + Date.now(),
          name,
          domain,
          category,
          reviews: [{ author, score, text }]
        });
      } else {
        const targetId = document.getElementById("existingSelect").value;
        const target = items.find(i => i.id === targetId);
        if (target) target.reviews.unshift({ author, score, text });
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      document.getElementById("reviewForm").reset();
      closeWriteModal();
      render();
    }

    render();
  </script>
</body>
</html>
